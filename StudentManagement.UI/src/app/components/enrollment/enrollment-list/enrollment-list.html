<div class="container mt-4 justify-content-center">

  <h2>Student Enrollment List</h2>

  <table class="table table-bordered">

    <thead>
      <tr>
        <th>Student Name</th>
        <th>Subject Name</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let item of enrollments">
        <td>{{ item.studentName }}</td>
        <td>{{ item.subjectName }}</td>
      </tr>
    </tbody>

  </table>

</div>
