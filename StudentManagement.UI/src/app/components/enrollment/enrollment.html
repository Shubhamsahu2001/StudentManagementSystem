<div class="container mt-4">

  <div class="card">

    <div class="card-header bg-primary text-white">
      <h3>Student Enrollment</h3>
    </div>

    <div class="card-body">

      <form [formGroup]="enrollmentForm" (ngSubmit)="onSubmit()">

        <!-- Student Dropdown -->
        <div class="mb-3">
          <label class="form-label">Select Student</label>

          <select class="form-select" formControlName="studentId">
            <option value="">-- Select Student --</option>

            @for (student of students; track student.studentId) {
              <option [value]="student.studentId">
                {{ student.firstName }} {{ student.lastName }}
              </option>
            }
          </select>

        </div>

        <!-- Subjects -->
        <div class="mb-3">

          <label class="form-label">Select Subjects</label>

          @for(subject of subjects; track subject.subjectId){

            <div class="form-check">

             <input
  class="form-check-input"
  type="checkbox"
  [value]="subject.subjectId"
  (change)="onSubjectChange($event)"
  id="subject{{subject.subjectId}}">
              <label
                class="form-check-label"
                for="subject{{subject.subjectId}}">
                {{subject.subjectName}}
              </label>

            </div>

          }

        </div>

        <button type="submit" class="btn btn-success">
  Save Enrollment
</button>

      </form>

    </div>

  </div>

</div>
